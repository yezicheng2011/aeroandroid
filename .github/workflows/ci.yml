name: CI
on:
  push:
  pull_request:
jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash -n and shellcheck
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f \( -name '*.sh' -o -name '*.command' \) \
            -not -path './third_party/*' -not -path './.git/*' -print0)
          [[ ${#files[@]} -gt 0 ]]
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck "${files[@]}"
      - name: Unit tests
        run: python3 -m unittest discover -s tests
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Select Xcode 16
        run: |
          xc="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xc/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Swift build
        run: swift build --package-path macos
      - name: Java to Swift frame compatibility, including small desktop widgets
        run: |
          mkdir -p work/wire-tests
          javac --release 8 -d work/wire-tests guest/src/dev/dan/androidsubsystem/SurfaceWire.java tests/GenerateSurfaceFrame.java
          java -cp work/wire-tests GenerateSurfaceFrame work/wire-tests/app.packet work/wire-tests/widget.packet
          swiftc macos/Sources/AndroidSubsystem/GraphicsProtocol.swift macos/Sources/AndroidSubsystem/L10n.swift tests/GraphicsProtocolTests.swift -o work/wire-tests/check
          work/wire-tests/check work/wire-tests/app.packet work/wire-tests/widget.packet
  guest-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned Android API and build tools
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, zipfile
          entry = next(a for a in json.load(open('scripts/runtime-lock.json'))['archives']
                       if a.get('package') == 'platforms;android-36')
          sdk = pathlib.Path('work/ci-sdk')
          urllib.request.urlretrieve(entry['url'], 'platform.zip')
          assert hashlib.sha256(pathlib.Path('platform.zip').read_bytes()).hexdigest() == entry['sha256']
          with zipfile.ZipFile('platform.zip') as archive:
              jar = next(n for n in archive.namelist() if n.endswith('/android.jar'))
              platform = sdk / 'platforms/android-36'
              platform.mkdir(parents=True)
              (platform / 'android.jar').write_bytes(archive.read(jar))
          url = 'https://dl.google.com/android/repository/build-tools_r36_linux.zip'
          urllib.request.urlretrieve(url, 'build-tools.zip')
          expected = '5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b'
          assert hashlib.sha256(pathlib.Path('build-tools.zip').read_bytes()).hexdigest() == expected
          with zipfile.ZipFile('build-tools.zip') as archive:
              archive.extractall(sdk / 'unpacked')
          tools = sdk / 'build-tools/36.0.0'
          tools.parent.mkdir()
          (sdk / 'unpacked/android-16').rename(tools)
          for name in ('aapt2', 'd8', 'zipalign', 'apksigner'):
              (tools / name).chmod(0o755)
          PY
      - name: Build and verify signed guest APK
        env:
          ANDROID_SUBSYSTEM_SDK: ${{ github.workspace }}/work/ci-sdk
          ANDROID_SUBSYSTEM_SIGNING_DIR: ${{ runner.temp }}/guest-signing
        run: |
          bash scripts/build-guest.sh
          bash scripts/build-widget-probe.sh
