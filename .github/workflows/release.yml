name: Desktop release
# Builds the lightweight macOS pkg (the app, with the Android installer inside it) and publishes a GitHub Release.
# Universal binary (Apple Silicon + Intel). Free signing only: ad-hoc codesign. No paid identity and no notarization.
# The Android Emulator / SDK / system image are NOT bundled (Android SDK License §3.4 forbids
# redistribution); the app downloads them at first launch, SHA-256 pinned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.2.1'
        required: true
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          # The app's version comes from the VERSION file; a tag that disagrees would ship a mislabelled build.
          test "$(tr -d '[:space:]' < VERSION)" = "${tag#v}" || { echo "::error::tag $tag does not match VERSION $(cat VERSION)"; exit 1; }
          # The sources need a Swift 6 compiler (Xcode 16, run in Swift 5 language mode), like current Command Line Tools.
          ls -d /Applications/Xcode_*.app
          xc="$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xc/Contents/Developer"
          uname -m; sw_vers; xcodebuild -version; swift --version
      - name: Fetch pinned build toolchain (JDK 17, build-tools 36, android-36 platform; SHA-256 checked)
        run: |
          tc="$RUNNER_TEMP/tc"; mkdir -p "$tc/dl" "$tc/sdk/build-tools" "$tc/sdk/platforms"
          python3 - scripts/runtime-lock.json > "$tc/list.tsv" <<'PY'
          import json, sys
          for a in json.load(open(sys.argv[1]))['archives']:
              r = a['relative_path']
              if 'OpenJDK' in r or 'build-tools' in r or '/platform-3' in r:
                  print(a['url'], r.split('/')[-1], a['sha256'], sep='\t')
          PY
          while IFS=$'\t' read -r url name sha; do
            curl -fsSL --retry 3 -o "$tc/dl/$name" "$url"
            echo "$sha  $tc/dl/$name" | shasum -a 256 -c -
          done < "$tc/list.tsv"
          mkdir -p "$tc/x"
          tar -xzf "$tc"/dl/OpenJDK17U-*.tar.gz -C "$tc/x"; mv "$tc"/x/jdk-17* "$tc/jdk"
          unzip -q "$tc"/dl/build-tools_*.zip -d "$tc/x/bt"; mv "$tc"/x/bt/* "$tc/sdk/build-tools/36.0.0"
          unzip -q "$tc"/dl/platform-36_*.zip -d "$tc/x/pl"; mv "$tc"/x/pl/* "$tc/sdk/platforms/android-36"
          echo "JAVA_HOME=$tc/jdk/Contents/Home" >> "$GITHUB_ENV"
          echo "ANDROID_SUBSYSTEM_SDK=$tc/sdk" >> "$GITHUB_ENV"
          # Throwaway CI signing key for the guest APK; never published.
          echo "ANDROID_SUBSYSTEM_SIGNING_DIR=$RUNNER_TEMP/ci-signing" >> "$GITHUB_ENV"
      - name: Build guest APK and Mac app
        run: |
          /bin/bash scripts/build-guest.sh
          AEROANDROID_UNIVERSAL=1 /bin/bash scripts/build-mac.sh
      - name: Check architecture (arm64 and x86_64)
        run: |
          app="dist/Android Subsystem.app"
          helper="$app/Contents/Helpers/APK Installer.app/Contents/MacOS/AndroidSubsystem"
          lipo -info "$app/Contents/MacOS/AndroidSubsystem" "$helper"
          for f in "$app/Contents/MacOS/AndroidSubsystem" "$helper"; do
            for arch in arm64 x86_64; do
              lipo -archs "$f" | grep -qw "$arch" || { echo "::error::missing $arch slice: $f"; exit 1; }
            done
          done
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
      - name: Ad-hoc sign (free; avoids the "damaged" error on Apple silicon)
        run: |
          app="dist/Android Subsystem.app"
          xattr -cr "$app"
          codesign --force --timestamp=none --sign - "$app/Contents/Helpers/APK Installer.app"
          codesign --force --deep --timestamp=none --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Save the report before searching it. grep -q on a codesign pipe
          # exits 141 under pipefail because codesign receives SIGPIPE.
          codesign -dv --verbose=2 "$app" >/tmp/cs.txt 2>&1
          cat /tmp/cs.txt
          grep -q 'Signature=adhoc' /tmp/cs.txt
      - name: Smoke test (offline launch, no runtime installed)
        run: |
          app="dist/Android Subsystem.app"
          export HOME="$RUNNER_TEMP/smoke-home"; mkdir -p "$HOME"
          # Backend controller answers with JSON even without a runtime.
          /usr/bin/python3 "$app/Contents/Resources/backend/subsystem.py" status '{}' > /tmp/status.json || true
          cat /tmp/status.json; python3 -c 'import json;json.load(open("/tmp/status.json"))'
          # The GUI must start and stay up.
          "$app/Contents/MacOS/AndroidSubsystem" > /tmp/app.log 2>&1 & pid=$!
          sleep 20
          if ! kill -0 $pid 2>/dev/null; then cat /tmp/app.log; echo '::error::app exited early'; exit 1; fi
          echo "app alive after 20s (pid $pid)"; kill $pid; wait $pid || true
      - name: Build pkg
        run: |
          v="${{ steps.v.outputs.version }}"
          # No GPL parts are tracked: microg-spoof/ and third_party/Magisk/ stay out of the app.
          test ! -e microg-spoof && test ! -e third_party/Magisk
          bash scripts/package-pkg.sh
          test -f "out/aeroandroid-$v-macOS-universal.pkg"
          ls -l out/ | awk '{print "pkg size:", $5, "bytes", $9}'
          dest="$RUNNER_TEMP/pkg-expanded"
          pkgutil --expand-full "out/aeroandroid-$v-macOS-universal.pkg" "$dest"
          app="$(find "$dest" -type d -name 'Android Subsystem.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=2 "$app" >/tmp/cs-pkg.txt 2>&1
          cat /tmp/cs-pkg.txt
          grep -q 'Signature=adhoc' /tmp/cs-pkg.txt
          if grep -E 'Authority=Developer ID|Notarization Ticket' /tmp/cs-pkg.txt; then
            echo '::error::package app is not an ad-hoc signature'
            exit 1
          fi
          lipo -info "$app/Contents/MacOS/AndroidSubsystem"
          test -f "$app/Contents/Resources/scripts/install-runtime.py"
          test -f "$app/Contents/Resources/scripts/mirror.py"
          test -f "$app/Contents/Resources/scripts/setup-offline-mac.py"
          /usr/bin/python3 "$app/Contents/Resources/scripts/install-runtime.py" --help
          HOME="$RUNNER_TEMP/inst-home" /usr/bin/python3 "$app/Contents/Resources/scripts/install-runtime.py" status --root "$RUNNER_TEMP/inst-home/AndroidSubsystem"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/* }

  release:
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release (never overwrites an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then echo "::error::release $tag already exists; not overwriting"; exit 1; fi
          gh release create "$tag" artifacts/* --title "aeroandroid ${tag}" --notes-file docs/RELEASE_NOTES.md --target "$GITHUB_SHA"